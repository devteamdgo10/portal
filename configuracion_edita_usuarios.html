        <!--li class="active">Here</li-->

    <!-- Main content -->
    <section class="content">

      <!-- Your Page Content Here -->
  
      <div id="message"></div>
      <div class="box box-primary">
        <!-- form start -->
        <form  action="" class="form-horizontal row-border" method="post" id="form">
            <input type="hidden" name="Id_Usuario" value="" id="Id_Usuario" >
            <div class="box-body">
              <div class="col-md-6">
                <div class="form-group" >
                    <label class="control-label">Nombre de Usuario</label>
                    
                        <input type="text" value="" name="NombreUsuario" id="NombreUsuario" 
                               title="Nombre de Usuario" required=""
                               placeholder="Nombre de Usuario" class="form-control" >
                    
                </div>     

                <div class="form-group" >
                    <label class="control-label">Cuenta de Usuario - Login</label>
                    
                        <input type="text" value="" name="Cuenta" id="Cuenta" 
                               title="Cuenta de Usuario" required=""
                               placeholder="Cuenta de Usuario" class="form-control" >
                    
                </div>   

                <div id="divPwd" class="form-group" >
                  <label class="control-label">Contraseña</label>
                  
                      <input type="password" value="" name="Pwd" id="Pwd" 
                             title="Contraseña" required=""
                             placeholder="Contraseña" class="form-control" >
                  
                </div>     

                <div id="divPwd2" class="form-group" >
                  <label class="control-label">Confirmar Contraseña</label>
                  
                      <input type="password" value="" name="Pwd2" id="Pwd2" 
                             title="Confirmar Contraseña" required=""
                             placeholder="Contraseña" class="form-control" >
                  
                </div>  
                
                <div class="form-group" >
                  <label class="control-label">Cuenta - Conexion</label>
                  <select name="Cuenta_Id" class="form-control" id="Cuenta_Id">
                      <option value="0">Seleccionar</option>  
                    </select>  
                </div> 

                <div class="form-group" >
                  <label class="control-label">Rol</label>
                  <select name="Rol_Id" class="form-control" id="Rol_Id">
                      <option value="0">Seleccionar</option>  
                    </select>  
                </div> 

                <div class="form-group" >
                  <label class="control-label">Estatus</label>
                  
                      <select name="Estatus" class="form-control" id="Estatus">
                          <option value="1" selected>Activo
                          </option>
                          <option value="0" >Inactivo
                          </option>
                      </select>                  
                </div>

                <div class="form-group" >
                  <label class="control-label">Token</label>
                      <div class="row">
                        <div class="col-sm-9">
                          <input type="text" value="" name="Token" id="Token" 
                             title="Token" 
                             placeholder="Token" class="form-control" >
                        </div>
                        <div class="col-sm-2">
                          <button type="button" class="btn btn-default" onclick="genToken()">Generar Token</button>
                        </div>                        
                      </div>
                </div>     

                <input type="hidden" name="accion" value="alt" id="accion" >
              </div>
              <div class="overlay" id="DivLoading">
                <i class="fa fa-refresh fa-spin"></i>
              </div>
            </div>
            <!-- /.box-body -->
            <div class="box-body">
              <div class="block-area" id="responsiveTable">
                  <div align="center">
                    <div class="btn-toolbar">
                        <h3>Permisos de Usuario:</h3>
                    </div>                        
                  </div>
                  <br />
                  <div class="table-responsive">
                    <table cellpadding="0" cellspacing="0" border="0" width="100%"
                      class="tile table table-bordered table-striped table-hover datatables display  dt-responsive no-wrap" id="example">
                      <thead>
                      <tr>
                        <tr>                          
                          <th style="max-width: 80px;">ID</th>
                          <th style="min-width: auto;">Permiso</th> 
                          <th style="min-width: 180px; max-width: 180px;">Acciones</th>                                          
                        </tr>
                      </tr>
                      </thead>
                    </table>
                  </div>
              </div>
            </div>
            <!-- /.box-body -->
  
            <div class="box-footer">
              <button class="btn-primary  btn" type="submit" id="saveButton"><i class="fa fa-save"></i> Guardar</button>
            </div>
          </form>
